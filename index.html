<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Deadline Scheduler — a professional job sequencing and critical time slot analysis platform for the Design and Analysis of Algorithms project." />
  <meta name="theme-color" content="#0b1020" />
  <title>Deadline Scheduler — Algorithm Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2338bdf8'/%3E%3Cpath d='M10 8v4M22 8v4M8 14h16M9 12h14a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V13a1 1 0 0 1 1-1Z' fill='none' stroke='%2307111f' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='m13 20 2 2 4-4' fill='none' stroke='%2307111f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    try {
      var savedTheme = localStorage.getItem("deadline-scheduler-theme");
      document.documentElement.setAttribute("data-theme", savedTheme === "light" ? "light" : "dark");
    } catch (error) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
  <link rel="stylesheet" href="./assets/css/app.css" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="sidebar-head">
        <a class="brand" href="#/overview" aria-label="Deadline Scheduler overview">
          <span class="brand-mark" id="brandMark"></span>
          <span class="brand-text">
            <span class="brand-name">Deadline Scheduler</span>
            <span class="brand-sub">Algorithm Lab</span>
          </span>
        </a>
        <button class="icon-btn sidebar-close" type="button" data-action="close-sidebar" aria-label="Close navigation">
          <span id="sidebarCloseIcon"></span>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-foot">
        <div class="sidebar-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span><b>Greedy engine</b>Deterministic &amp; verified</span>
        </div>
        <button class="collapse-btn" type="button" data-action="toggle-sidebar" aria-label="Collapse sidebar">
          <span id="collapseIcon"></span>
          <span>Collapse sidebar</span>
        </button>
      </div>
    </aside>
    <div class="sidebar-backdrop" data-action="close-sidebar" aria-hidden="true"></div>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu" type="button" data-action="open-sidebar" aria-label="Open navigation">
            <span id="mobileMenuIcon"></span>
          </button>
          <div class="page-meta">
            <div class="breadcrumb" id="breadcrumb"></div>
            <h1 class="page-title" id="pageTitle">Overview</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="build-chip" id="buildChip">DAA · Job Sequencing</span>
          <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="Toggle color theme" title="Toggle color theme">
            <span id="themeIcon"></span>
          </button>
          <button class="btn btn-ghost" type="button" data-action="reset-simulation" title="Reset the simulation to the starter sample">
            <span id="resetIcon"></span>
            <span>Reset simulation</span>
          </button>
          <button class="btn btn-primary" type="button" data-action="run-analysis" title="Run the greedy scheduling analysis">
            <span id="runIcon"></span>
            <span>Run Analysis</span>
          </button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div style="padding:24px;font-family:system-ui;color:#f8fafc;background:#0b1020">
      Deadline Scheduler needs JavaScript enabled to run the interactive algorithm analysis.
    </div>
  </noscript>

  <script src="./assets/js/algorithm.js"></script>
  <script src="./assets/js/icons.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
